<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 🎁🎁🎁 ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d79;
            --soft-pink: #ffb3c1;
            --disney-magic: #d4af37; /* Màu vàng hoàng gia / phép thuật */
            --deep-garden: #1a0008; /* Đỏ rượu vang sâu thẳm làm nền cho hoa hồng */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--deep-garden);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Nền phép thuật - Đổi sang dải gradient đỏ hoa hồng/rượu vang */
        .rose-field-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(150, 0, 40, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 85% 75%, rgba(200, 20, 60, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(20, 0, 5, 1) 0%, transparent 100%);
            z-index: 0;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            flex-direction: column;
            pointer-events: none;
        }

        .start-btn {
            background: none;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .start-btn:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 60px rgba(212, 175, 55, 0.8)); /* Glow vàng phép thuật */
        }

        .bouquet-icon {
            width: 280px;
            height: 280px;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
            animation: float 4s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .btn-text {
            color: white;
            margin-top: -10px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--disney-magic), #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        @keyframes shine {
            to { background-position: 200%; }
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        #runner-bear {
            position: absolute;
            top: 50%;
            left: 0;
            width: 200px;
            height: 200px;
            transform: translate3d(-300px, -50%, 0);
            z-index: 2;
            will-change: transform;
            /* Gấu phát sáng aura phép thuật nhẹ */
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); 
        }

        .bear-svg {
            width: 100%;
            height: 100%;
            transform-origin: center bottom;
            /* Hiệu ứng xoay mượt khi gấu lật người */
            transition: transform 0.25s ease-in-out; 
        }

        /* CÁC CLASS CHO ĐIỆU NHẢY MOONWALK */
        .moonwalking .bear-svg {
            /* Lật trục X (quay mặt về trái) và hơi ngả người ra sau một xíu */
            transform: scaleX(-1) rotate(-3deg); 
        }

        .moonwalking #leg-l {
            /* Trượt chân điệu nghệ */
            animation: moonwalkLeg 1.2s infinite linear;
        }

        .moonwalking #leg-r {
            /* Chân còn lại trượt lệch nhịp để tạo cảm giác đi bộ */
            animation: moonwalkLeg 1.2s infinite linear 0.6s;
        }

        @keyframes moonwalkLeg {
            0%, 100% { transform: translateX(12px); }
            50% { transform: translateX(-12px); }
        }

        #card-wrapper {
            background: linear-gradient(135deg, #fffdf0 0%, #fcf5d8 100%); /* Màu giấy da cổ tích */
            padding: 40px 50px;
            border-radius: 8px; /* Bo góc ít hơn cho giống quyển sách */
            max-width: 90%;
            width: 500px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, 0, 0) scale(0.1) rotate(-10deg); 
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            /* Viền vàng hoàng gia */
            border: 2px solid var(--disney-magic);
            pointer-events: auto; 
            overflow: hidden; 
            will-change: transform, opacity;
        }

        .card-thrown {
            transform: translate3d(-50%, -50%, 0) scale(1) rotate(0deg) !important;
            opacity: 1 !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212, 175, 55, 0.3), inset 0 0 30px rgba(255,255,255,0.8) !important;
        }

        /* Nếp gấp giả lập mép thiệp viền đôi hoàng gia */
        #card-wrapper::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid var(--disney-magic);
            border-radius: 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }

        /* ----- TRANG TRÍ DÂY LEO HOA HỒNG (Beauty and the Beast vibes) ----- */
        .decor-corner {
            position: absolute;
            width: 140px;
            height: 140px;
            pointer-events: none;
            z-index: 2; 
        }

        .decor-top-left {
            top: 0;
            left: 0;
        }

        .decor-bottom-right {
            bottom: 0;
            right: 0;
            transform: rotate(180deg);
        }

        .typed-text-container {
            font-family: 'Great Vibes', cursive; /* Font chữ uốn lượn phong cách hoàng gia/phép thuật */
            font-size: 2.8rem; /* Chữ to hơn vì font này nét mảnh */
            color: #4a0e2e;
            line-height: 1.4;
            min-height: 180px;
            position: relative;
            z-index: 10; 
            text-shadow: 0 0 1px rgba(212, 175, 55, 0.6); /* Bóng chữ vàng nhạt */
            padding: 10px 20px;
        }

        #typedText {
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 2.6rem;
            background-color: var(--disney-magic);
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 4px;
            box-shadow: 0 0 5px var(--disney-magic);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="rose-field-bg"></div>
    <canvas id="canvas"></canvas>

            <!-- Hoa hồng được thay thế gradient rực rỡ mầu nhiệm hơn -->

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const uiLayer = document.getElementById('ui');
        
        const sceneContainer = document.getElementById('scene-container');
        const runnerBear = document.getElementById('runner-bear');
        const bearHolding = document.getElementById('bear-holding');
        const bearThrown = document.getElementById('bear-thrown');
        const cardWrapper = document.getElementById('card-wrapper');
        const miniEnvelope = document.getElementById('mini-envelope'); 
        
        const typedText = document.getElementById('typedText');
        const cursor = document.getElementById('cursor');

        let width, height;
        let particles = [];
        let bokehParticles = [];
        let animationStarted = false;
        
        const MAX_PARTICLES = 250; 
        const BOKEH_COUNT = 100; 
        
        const flowerEmojis = ['✨', '🌟', '💫', '🎀', '🌹', '🦋', '🎹', '🪄', '🦋', '🐝','🧸'];

        class Bokeh {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 200 + 40; 
                this.color = this.getRandomColor();
                this.opacity = Math.random() * 0.25 + 0.05; 
                this.vx = (Math.random() - 0.5) * 0.3; 
                this.vy = (Math.random() - 0.5) * 0.3;
            }
            getRandomColor() {
                const colors = [
                    'rgba(255, 51, 102,', 
                    'rgba(255, 0, 64,',    
                    'rgba(255, 179, 193,', 
                    'rgba(179, 0, 45,'     
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = height + this.size;
                if (this.y > height + this.size) this.y = -this.size;
            }
            draw() {
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, this.color + this.opacity + ')');
                grad.addColorStop(0.5, this.color + (this.opacity * 0.5) + ')');
                grad.addColorStop(1, this.color + '0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor() {
                this.init(true);
                this.active = false;
            }
            init(isBurst = false) {
                if (isBurst) {
                    this.x = width / 2;
                    this.y = height / 2;
                    const angle = Math.random() * Math.PI * 2;
                    const force = Math.random() * 12 + 4;
                    this.vx = Math.cos(angle) * force;
                    this.vy = Math.sin(angle) * force;
                } else {
                    this.x = Math.random() * width;
                    this.y = -50;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 2 + 0.5;
                }
                this.size = Math.random() * 25 + 15;
                this.emoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05; 
                this.swayAngle = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.03 + 0.01;
                this.active = true;
            }
            update() {
                if (!this.active) return;
                
                this.x += this.vx + Math.sin(this.swayAngle) * 1.5;
                this.y += this.vy;
                
                this.swayAngle += this.swaySpeed;
                this.rotation += this.rotationSpeed;
                
                this.vy += 0.02; 
                if (this.vy > 3.5) this.vy = 3.5; 
                
                this.vx *= 0.99; 
                
                if (this.y > height + 50) {
                    if (animationStarted) this.init(false);
                    else this.active = false;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.fillStyle = 'white';
                ctx.globalAlpha = 1;

                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        function initBokeh() {
            bokehParticles = [];
            for (let i = 0; i < BOKEH_COUNT; i++) {
                bokehParticles.push(new Bokeh());
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBokeh(); 
        }

        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push(new Particle());
        }

        function launchBurst(count) {
            let triggered = 0;
            for (let p of particles) {
                if (!p.active && triggered < count) {
                    p.init(true);
                    triggered++;
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 0, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';
            for (let b of bokehParticles) {
                b.update();
                b.draw();
            }
            ctx.globalCompositeOperation = 'source-over';

            for (let p of particles) {
                p.update();
                p.draw();
            }
            
            if (animationStarted) {
                if (Math.random() > 0.4) {
                    for (let i = 0; i < MAX_PARTICLES; i++) {
                        if (!particles[i].active) {
                            particles[i].init(false);
                            break; 
                        }
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            if (animationStarted) return;
            animationStarted = true;
            
            uiLayer.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            uiLayer.style.opacity = '0';
            uiLayer.style.transform = 'scale(1.5)';
            
            setTimeout(() => {
                uiLayer.classList.add('hidden');
                
                sceneContainer.classList.remove('hidden');
                
                void runnerBear.offsetWidth;
                
                // 1. Gấu Moonwalk từ trái ra giữa
                runnerBear.classList.add('moonwalking');
                runnerBear.style.transition = 'transform 3s linear'; 
                runnerBear.style.transform = `translate3d(calc(50vw - 100px), -50%, 0)`;
                
                setTimeout(() => {
                    // 2. Dừng Moonwalk, gấu xoay người đối mặt
                    runnerBear.classList.remove('moonwalking');
                    
                    // Ẩn lá thư cầm ở tay, giơ hai tay lên
                    miniEnvelope.style.display = 'none';
                    bearHolding.style.display = 'none';
                    bearThrown.style.display = 'block';
                    
                    // Phóng tấm thiệp vào màn hình
                    cardWrapper.classList.add('card-thrown');
                    
                    setTimeout(() => {
                         // 3. Giữ nguyên tay giơ lên, xoay lưng lại và tiếp tục Moonwalk đi xa
                         // Đã bỏ thao tác hạ tay xuống ở đoạn này để gấu "giữ trọn tư thế cool ngầu"
                         
                         runnerBear.classList.add('moonwalking');
                         runnerBear.style.transition = 'transform 2.5s linear'; 
                         runnerBear.style.transform = `translate3d(120vw, -50%, 0)`; 
                    }, 800); 

                    // 4. Bắt đầu viết lời chúc
                    setTimeout(startTyping, 1200);

                }, 3000); 

            }, 800);

            launchBurst(150);
        });

        // Lời chúc như một câu chuyện cổ tích mầu nhiệm
        const message = "✨Dear bé Tranggggg!\n\nAnh xin phép được gửi bé bông hoa nhé 🌹 và chúc bé ngủ ngon ạaaaa 🧸";
        let textIndex = 0;

        function startTyping() {
            if (textIndex < message.length) {
                let char = message.charAt(textIndex);
                if (char === '\n') {
                    typedText.innerHTML += '<br>';
                } else {
                    typedText.innerHTML += char;
                }
                textIndex++;
                
                let typingSpeed = Math.random() * 50 + 40; 
                if (char === ',' || char === '.' || char === '\n' || char === '✨') typingSpeed += 400; 
                
                setTimeout(startTyping, typingSpeed);
            } else {
                setTimeout(() => {
                    cursor.style.animation = 'none';
                    cursor.style.opacity = '0';
                    cursor.style.transition = 'opacity 1s ease';
                }, 2000);
            }
        }

        animate();
    </script>
</body>
